spring:
  application:
    name: spring-ai-rag

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:ragdb}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}

  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 20MB

  ai:
    model:
      chat: anthropic
      embedding: openai
    anthropic:
      api-key: ${ANTHROPIC_API_KEY}
      chat:
        options:
          model: claude-opus-5-5
          max-tokens: 16000
    openai:
      api-key: ${OPENAI_API_KEY}
      embedding:
        options:
          model: text-embedding-3-small
    vectorstore:
      pgvector:
        initialize-schema: true
        index-type: HNSW
        distance-type: COSINE_DISTANCE
        dimensions: 1536

app:
  claude:
    effort: medium
    fallbacks-enabled: true
  rag:
    top-k: 4
    similarity-threshold: 0.3
    chunk-size: 800
    min-chunk-size-chars: 350
    load-sample-on-startup: false

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics

logging:
  level:
    org.springframework.ai.chat.client.advisor: INFO
    com.ezcloud.springai.claude: INFO
